<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduCast - Synced Video Player</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

    <!-- HOME SCREEN -->
    <div id="home-screen" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-brand-500/10 text-brand-500 border border-brand-500/30 mb-6 shadow-xl shadow-brand-500/10">
                <i class="fa-solid fa-play text-4xl ml-1"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-white mb-3">
                EduCast <span class="text-brand-500">Sync</span>
            </h1>
            <p class="text-slate-400 text-sm max-w-sm mx-auto">
                Watch videos in perfect sync across your phone, laptop, or TV.
            </p>
        </div>

        <div class="w-full max-w-sm space-y-6">
            <!-- Create Room -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl">
                <h2 class="text-lg font-bold mb-4 text-white">Start a New Session</h2>
                <button onclick="createRoom()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-brand-500/20">
                    Create Room
                </button>
            </div>

            <!-- Join Room -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl">
                <h2 class="text-lg font-bold mb-4 text-white">Join an Existing Room</h2>
                <div class="flex space-x-2">
                    <input id="join-room-input" type="text" placeholder="Room Code (e.g. A1B2)" maxlength="6" uppercase class="w-full bg-slate-950 border border-slate-800 text-center text-lg font-mono tracking-widest text-brand-500 py-3 rounded-2xl focus:outline-none focus:border-brand-500 uppercase">
                    <button onclick="joinRoom()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 rounded-2xl transition shadow-lg shadow-emerald-600/20">
                        Join
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ROOM SCREEN -->
    <div id="room-screen" class="hidden flex-1 flex flex-col h-screen w-full bg-black overflow-hidden relative">
        <!-- Header -->
        <header class="absolute top-0 inset-x-0 z-40 bg-gradient-to-b from-black/80 to-transparent px-4 py-4 flex items-center justify-between transition-opacity duration-300 hover:opacity-100" id="room-header">
            <div class="flex items-center space-x-3">
                <div class="bg-slate-900/80 backdrop-blur-md px-3 py-1.5 rounded-xl border border-slate-700/50 flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="connection-dot"></span>
                    <span class="text-xs font-mono text-slate-300">ROOM:</span>
                    <span id="display-room-code" class="text-sm font-bold text-brand-500 tracking-wider">----</span>
                </div>
                <span id="connection-status" class="text-xs font-medium text-amber-400 bg-amber-500/10 px-2 py-1 rounded-lg border border-amber-500/20">Waiting for peer...</span>
            </div>
            <button onclick="leaveRoom()" class="bg-rose-500/20 hover:bg-rose-500/40 text-rose-400 px-3 py-1.5 rounded-xl text-xs font-bold transition border border-rose-500/30 backdrop-blur-md">
                Leave
            </button>
        </header>

        <!-- Video Area -->
        <main class="flex-1 relative flex items-center justify-center w-full h-full bg-black group">
            
            <!-- Default Placeholder -->
            <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 p-8 text-center z-10">
                <i class="fa-solid fa-film text-5xl text-slate-700 mb-4"></i>
                <h2 class="text-xl font-bold text-slate-400">Waiting for a video link...</h2>
            </div>

            <!-- HTML5 Video (Direct Links) -->
            <video id="html-video" class="hidden w-full h-full object-contain" playsinline controls></video>

            <!-- YouTube Video -->
            <div id="youtube-wrapper" class="hidden w-full h-full pointer-events-none sm:pointer-events-auto">
                <div id="youtube-player" class="w-full h-full"></div>
            </div>

            <!-- Sync Overlay Badge -->
            <div id="sync-badge" class="absolute pointer-events-none opacity-0 transition-all duration-300 transform scale-125 z-30 bg-black/60 border border-brand-500 text-brand-500 w-24 h-24 rounded-full flex items-center justify-center text-4xl shadow-2xl backdrop-blur-md">
                <i id="sync-icon" class="fa-solid fa-play"></i>
            </div>
        </main>

        <!-- Bottom Controls -->
        <footer class="absolute bottom-0 inset-x-0 z-40 bg-gradient-to-t from-black via-black/90 to-transparent p-4 pb-6 transition-opacity duration-300">
            <div class="max-w-2xl mx-auto bg-slate-900/90 backdrop-blur-xl p-2 rounded-2xl border border-slate-700/50 shadow-2xl flex items-center space-x-2">
                <input id="video-link-input" type="url" placeholder="Paste YouTube or MP4 link here..." class="flex-1 bg-transparent text-sm text-white px-3 py-2 focus:outline-none placeholder-slate-500">
                <button onclick="loadVideoFromInput()" class="bg-brand-600 hover:bg-brand-500 active:scale-95 text-white text-sm px-4 py-2 rounded-xl font-bold transition shadow-md">
                    Play & Sync
                </button>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
